name: Quality Checks

on:
  pull_request:
    branches: [master, main]
  push:
    branches: [master, main]

# Read-only token unless a job asks for more; none of these jobs writes.
permissions:
  contents: read

jobs:
  validate:
    name: Validate Code Quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0  # Need full history for version comparison

      # pnpm version comes from package.json `packageManager`; pinning it here
      # as well makes pnpm/action-setup fail on the mismatch.
      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm i --frozen-lockfile

      - name: Check for Claude signatures
        run: |
          echo "🔍 Checking for Claude signatures..."

          # Use regex patterns to avoid false positives
          CLAUDE_SIG1="Generated with.*Claude"
          CLAUDE_SIG2="Co-Authored-By:.*Claude"

          if git log -1 --pretty=%B | grep -qE "$CLAUDE_SIG1"; then
            echo "❌ ERROR: Found Claude Code signature in commit message!"
            exit 1
          fi

          if git log -1 --pretty=%B | grep -qE "$CLAUDE_SIG2"; then
            echo "❌ ERROR: Found Claude Co-Authored-By in commit message!"
            exit 1
          fi

          # Exclude automation files from diff check
          if git diff HEAD~1 HEAD -- . ':(exclude).husky/*' ':(exclude).github/*' | grep -qE "$CLAUDE_SIG1"; then
            echo "❌ ERROR: Found Claude Code signature in diff!"
            exit 1
          fi

          if git diff HEAD~1 HEAD -- . ':(exclude).husky/*' ':(exclude).github/*' | grep -qE "$CLAUDE_SIG2"; then
            echo "❌ ERROR: Found Claude Co-Authored-By in diff!"
            exit 1
          fi

          echo "✅ No Claude signatures found"

      - name: Check version bump (on package.json changes)
        if: github.event_name == 'pull_request'
        # Through env, not interpolated into the script: a branch name is
        # attacker-controlled text and would otherwise be parsed as shell.
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          echo "📦 Checking if version was bumped..."

          # Check if package.json was modified
          if git diff --name-only "origin/$BASE_REF...HEAD" | grep -qx "package.json"; then
            OLD_VERSION=$(git show "origin/$BASE_REF:package.json" | grep '"version"' | head -1 | sed 's/.*"version": "\(.*\)".*/\1/')
            NEW_VERSION=$(cat package.json | grep '"version"' | head -1 | sed 's/.*"version": "\(.*\)".*/\1/')

            if [ "$OLD_VERSION" = "$NEW_VERSION" ]; then
              echo "❌ ERROR: package.json modified but version not bumped!"
              echo "   Current version: $OLD_VERSION"
              echo "   Please increment the version"
              exit 1
            fi

            echo "✅ Version bumped: $OLD_VERSION → $NEW_VERSION"
          else
            echo "ℹ️  package.json not modified, skipping version check"
          fi

      - name: Verify dist is up-to-date
        run: |
          echo "🔨 Verifying dist is up-to-date..."

          # Always rebuild. A conditional check keyed on "did HEAD~1..HEAD touch
          # src/" cannot see drift introduced by a merge commit, which is exactly
          # how the committed dist lost the VTODO API in f8d5561.
          pnpm build

          # porcelain also reports new and deleted files; the tsc declaration
          # build emits one .d.ts per module, so a missing file is real drift.
          DRIFT=$(git status --porcelain -- dist/)
          if [ -n "$DRIFT" ]; then
            echo "❌ ERROR: dist does not match a fresh build from src!"
            echo "$DRIFT"
            echo ""
            echo "Please run 'pnpm build' and commit the changes"
            exit 1
          fi

          echo "✅ dist matches a fresh build from src"

      # Consumers (dav-mcp) install @philflow/tsdav from npm under an alias,
      # `"tsdav": "npm:@philflow/tsdav@<version>"`, a path pnpm-based CI never
      # exercises. The packed tarball is installed the same way, under the
      # name `tsdav`, and imported as a consumer imports it.
      - name: Install as packed tarball
        run: |
          # --ignore-scripts: `prepare` is the git-hook installer, not a build.
          TARBALL="$GITHUB_WORKSPACE/$(npm pack --ignore-scripts | tail -1)"
          CONSUMER=$(mktemp -d)
          cd "$CONSUMER"
          echo '{ "name": "consumer", "version": "0.0.0", "private": true }' > package.json
          npm install --no-audit --no-fund "tsdav@file:$TARBALL"
          node --input-type=module -e "
            const m = await import('tsdav');
            if (typeof m.createDAVClient !== 'function' || typeof m.fetchTodos !== 'function') process.exit(1);
            console.log('✅ tarball installs and imports (ESM)');"
          node -e "
            const m = require('tsdav');
            if (require('tsdav/package.json').name !== '@philflow/tsdav') process.exit(1);
            if (typeof m.createDAVClient !== 'function' || typeof m.fetchTodos !== 'function') process.exit(1);
            console.log('✅ tarball installs and imports (CJS)');"

      - name: Summary
        if: success()
        run: |
          echo ""
          echo "✅ All quality checks passed!"
          echo ""
